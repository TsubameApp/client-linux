name: Linux CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.3.3"

      - name: Install Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            qt6-base-dev \
            qt6-base-private-dev \
            qt6-declarative-dev \
            qt6-declarative-dev-tools \
            qt6-wayland

      - name: Versions
        run: |
          swift --version
          cmake --version
          ninja --version
          qmake6 -query QT_VERSION

      - name: Configure
        run: |
          cmake \
            -S . \
            -B .build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build .build --parallel

      - name: QML lint
        run: |
          qmllint Resources/main.qml

  notify-umbrella:
    name: Notify umbrella
    needs: build

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    uses: TsubameApp/Tsubame/.github/workflows/notify-submodule-update.yml@main

    with:
      component: Linux

    secrets:
      automation_token: ${{ secrets.TSUBAME_AUTOMATION_TOKEN }}
